@if (this.isAddTaskVisible) {
<app-new-task (onCloseModal)="hideTaskWindow()" [userId]="selectedUser?.id!" />
}

<section id="tasks">
  <header>
    <h3>{{ this.selectedUser?.name }}</h3>
    <menu>
      <button (click)="showTaskWindow()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for(task of selectedUserTasks; track task.id) {
    <li>
      <app-task [task]="task"></app-task>
    </li>
    }
  </ul>
</section>
