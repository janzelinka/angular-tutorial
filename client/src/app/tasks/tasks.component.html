<section>
  <header>
    <h3>{{ this.selectedUser?.name }}</h3>
    <menu>
      <button>Add Task</button>
    </menu>
  </header>

  <ul>
    @for(task of selectedUserTasks; track task.id) {
    <li>
      <app-task
        (completeTask)="onCompleteTask($event)"
        [task]="task"
      ></app-task>
    </li>
    }
  </ul>
</section>
