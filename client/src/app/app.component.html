<header><app-header /></header>
<main>
  <ul id="users">
    <li *ngFor="let user of users">
      <app-user
        [id]="user.id"
        [avatar]="user.avatar"
        [userName]="user.name"
        (select)="onSelectUser($event)"
      />
    </li>
  </ul>
  <app-tasks [selectedUser]="this.selectedUser" />
</main>
